name: Studio Assistant checks
on:
  push:
    branches: [main, 'feature/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  assistant:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install uv
      - run: uv sync --locked
      - run: uv run python scripts/check_doc_links.py
      - run: uv run python -m unittest tests.test_studio_assistant tests.test_studio_assistant_providers -v
      - run: pnpm install --frozen-lockfile
        working-directory: studio-app
      - run: pnpm run typecheck
        working-directory: studio-app
      - run: pnpm run check:i18n
        working-directory: studio-app
      - run: pnpm run test:ui
        working-directory: studio-app
      - run: pnpm run build
        working-directory: studio-app
      - run: git diff --exit-code -- autoquant/studio_app
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install uv
      - run: uv sync --locked
      - run: uv run python -m unittest discover -s tests -v