<!doctype html><html><head><meta charset="utf-8"><title>preview</title></head><body class="ds-page" data-sign-convention="red-up"><div class="ds-stack"><div class="ds-optname">Display</div><div class="fact" style="display:flex;align-items:center;justify-content:space-between;gap:12px;border:1px solid var(--line)"><div><div>Price colours</div><p class="ds-note">Changes colours only. Numbers, signs and exports stay the same.</p></div><div class="seg" role="radiogroup" aria-label="Price colours"><button class="seg-opt" role="radio" aria-checked="true" data-v="red-up">Red up, green down</button><button class="seg-opt" role="radio" aria-checked="false" data-v="green-up">Green up, red down</button></div></div><dl class="metrics" data-sign-mode="focal" style="max-width:520px"><div class="metric"><dt>Rank IC</dt><dd><span class="sv sv--focal" data-sign="pos">+0.0412</span></dd></div><div class="metric"><dt>Max drawdown</dt><dd><span class="sv sv--focal" data-sign="neg">−12.4%</span></dd></div><div class="metric"><dt>HAC t</dt><dd>2.31</dd></div></dl></div><script>document.querySelectorAll(".seg-opt").forEach(function(b){b.onclick=function(){document.body.setAttribute("data-sign-convention",b.dataset.v);document.querySelectorAll(".seg-opt").forEach(function(o){o.setAttribute("aria-checked",o===b?"true":"false")})}});</script></body></html>
