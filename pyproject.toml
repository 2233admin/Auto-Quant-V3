[project]
name = "auto-quant"
version = "3.0.0"
description = "Agent-native workbench that turns quantitative research into versioned, testable engineering workflows."
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "exchange-calendars==4.13.2",
]

[project.optional-dependencies]
columnar = ["pyarrow>=16"]
# Ported Shinka research layer (`aq shinka ...`); runs and cost reads additionally need shinka-engine.
shinka = ["pydantic>=2", "pyyaml", "scipy", "psutil"]
# The ShinkaEvolve evolution engine itself (not vendored).
shinka-engine = ["shinka-evolve"]

[dependency-groups]
dev = [
    "hatchling>=1.31.0",
    "jsonschema>=4.23",
]
# Test runner for tests/shinka_research (the rest of the suite uses unittest).
shinka-test = ["pytest>=8"]

[project.scripts]
aq = "autoquant.cli:main"
aq-python = "autoquant.python_runner:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["autoquant"]
# Code Intel structural-gate governance files, not runtime code.
exclude = ["autoquant/.sentrux"]

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.uv]
package = true

# The research layer targets the 2233admin fork of ShinkaEvolve (it adds
# shinka.database.cost); upstream SakanaAI/shinka-evolve on PyPI does not have it.
[tool.uv.sources]
shinka-evolve = { git = "https://github.com/2233admin/ShinkaEvolve", rev = "a43eb89b01432d19c95f35c3f24a4576e8ed3a53" }
